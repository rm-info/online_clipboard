{% extends "base.html" %}
{% block title %}{{ tr.auth_title }} — {{ sid }}{% endblock %}
{% block header_title %}{{ tr.auth_title }}{% endblock %}
{% block header_sub %}<div class="header-sub">{{ tr.auth_subtitle }} <code style="color:var(--accent)">{{ sid }}</code></div>{% endblock %}

{% block content %}
<div class="panel" style="max-width:620px;">
  <div class="panel-label">{{ tr.authentication }}</div>

  <div id="errorBox" style="display:none; margin-bottom:14px;"></div>

  <div class="field">
    <label for="password">{{ tr.password }}</label>
    <input type="password" id="password" placeholder="{{ tr.enter_session_password }}" autocomplete="current-password" autofocus>
  </div>

  <div class="flex-row flex-end">
    <a href="/" class="btn btn-ghost">← {{ tr.new_session }}</a>
    <button class="btn btn-primary" id="authBtn" onclick="doAuth()">↗ {{ tr.submit }}</button>
  </div>
</div>

<script>
  const sid = {{ sid | tojson }};
  const tr = {{ tr | tojson }};

  async function doAuth() {
    const btn = document.getElementById('authBtn');
    const pwd = document.getElementById('password').value;
    const errorBox = document.getElementById('errorBox');

    btn.disabled = true;
    btn.textContent = tr.checking;
    errorBox.style.display = 'none';

    const body = new URLSearchParams({ password: pwd });

    try {
      const res = await fetch(`/${sid}/auth`, {
        method: 'POST',
        body,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        redirect: 'follow',
      });

      if (res.ok || res.redirected) {
        window.location.href = res.url || `/${sid}`;
        return;
      }

      const data = await res.json().catch(() => ({}));

      if (res.status === 410) {
        errorBox.className = 'alert alert-danger';
        errorBox.textContent = tr.session_locked_error;
        errorBox.style.display = 'block';
        btn.disabled = true;
        return;
      }

      if (res.status === 429) {
        const type = data.ban_type === 'perm' ? tr.ban_type_perm : tr.ban_type_temp;
        errorBox.className = 'alert alert-danger';
        errorBox.textContent = tr.ip_banned_error.replace('{type}', type);
        errorBox.style.display = 'block';
        btn.disabled = true;
        return;
      }

      if (res.status === 401) {
        errorBox.className = 'alert alert-danger';
        errorBox.textContent = tr.wrong_password_error.replace('{remaining}', data.attempts_remaining ?? '?');
        errorBox.style.display = 'block';
      }
    } catch (err) {
      errorBox.className = 'alert alert-warn';
      errorBox.textContent = tr.network_error;
      errorBox.style.display = 'block';
    }

    btn.disabled = false;
    btn.textContent = `↗ ${tr.submit}`;
  }

  document.getElementById('password')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doAuth();
  });
</script>
{% endblock %}
